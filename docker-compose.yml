services:
  regio:
    build: .
    container_name: REGIO_seguro
    restart: always
    ports:
      - "9999:80"
    env_file:
      - .env
    volumes:
      - ./data:/home/regio/data:rw
      - ./static:/home/regio/static:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
