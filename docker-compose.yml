services:
  regio:
    build: .
    container_name: REGIO_seguro
    restart: always

    ports:
      - "9999:80"
      - "8443:443"

    env_file:
      - .env

    volumes:
      - ./data:/home/regio/data:rw
      - ./static:/home/regio/static:ro
      # Si usas TLS nativo, mapea tus certificados aquí:
      # - ./certs:/home/regio/certs:ro

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    cap_add:
      - CAP_NET_BIND_SERVICE

    read_only: true
    tmpfs:
      - /tmp

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"
        reservations:
          cpus: "0.1"
          memory: "32M"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
