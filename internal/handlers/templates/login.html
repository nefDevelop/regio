<!doctype html>
<html>
  <head>
    <title>reGIO - Iniciar Sesión</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/static/reGIO.svg" />
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      .login-header {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;
        gap: 12px;
      }
      .login-header img {
        height: 36px;
        filter: invert(1);
      }
      .login-header h2 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 1px;
        color: #f8fafc;
      }
      .login-subtitle {
        text-align: center;
        color: #94a3b8;
        font-size: 14px;
        margin-bottom: 32px;
      }
      .input-group {
        margin-bottom: 16px;
      }
      .custom-input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(0, 0, 0, 0.2);
        color: white;
        font-size: 15px;
        transition: all 0.2s;
        box-sizing: border-box;
      }
      .custom-input:focus {
        border-color: #818cf8;
        outline: none;
        background: rgba(0, 0, 0, 0.3);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
      }
      .custom-input::placeholder {
        color: #64748b;
      }
      .login-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        border: none;
        color: white;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.1s,
          box-shadow 0.2s;
        margin-top: 8px;
      }
      .login-btn:hover {
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
      }
      .login-btn:active {
        transform: translateY(1px);
      }
      .error-alert {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #fca5a5;
        padding: 12px 16px;
        border-radius: 12px;
        margin-bottom: 24px;
        font-size: 13px;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .help-text {
        font-size: 12px;
        color: #64748b;
        margin-top: 8px;
        display: block;
        text-align: right;
      }
    </style>
  </head>
  <body class="flex-center">
    <div class="login-box">
      <div class="login-header">
        <img src="/static/reGIO.svg" alt="logo" />
        <h2>reGIO</h2>
      </div>
      <p class="login-subtitle">Acceso seguro al proxy</p>

      {{if .}}
      <div class="error-alert">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        Credenciales o código 2FA incorrectos
      </div>
      {{end}}
      <form method="POST">
        <div class="input-group">
          <input type="text" name="user" class="custom-input" placeholder="Usuario" required autofocus autocomplete="username" />
        </div>

        <div class="input-group">
          <input type="password" name="pass" class="custom-input" placeholder="Contraseña" autocomplete="current-password" />
          <span class="help-text">Déjalo vacío si accedes con invitación</span>
        </div>

        <div class="input-group">
          <input
            type="text"
            name="2fa"
            class="custom-input"
            placeholder="Código 2FA (Opcional)"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            style="letter-spacing: 4px; text-align: center; font-family: ui-monospace, monospace; font-size: 18px"
          />
        </div>

        <button type="submit" class="login-btn">Entrar</button>
      </form>
    </div>
  </body>
</html>
