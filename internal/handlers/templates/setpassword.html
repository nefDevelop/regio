<!doctype html>
<html>
  <head>
    <title>Crear Contraseña - reGIO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/static/reGIO.svg" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="flex-center">
    <div class="login-box">
        <h4 style="margin: 0 0 8px 0; color: var(--primary)">Configurar contraseña</h4>
        <p style="margin-bottom: 30px; font-size: 14px">Es tu primera vez. Crea una contraseña segura.</p>
        
        {{if .Error}}
        <div class="error" style="margin-bottom: 20px; color: #ef4444; font-size: 13px">{{.Error}}</div>
        {{end}}

        <form method="POST">
          <input type="hidden" name="user" value="{{.User}}" />
          <input type="hidden" name="step" value="set_password" />
          <input type="password" name="new_pass" placeholder="Nueva contraseña" required style="width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white" />
          <input type="password" name="confirm_pass" placeholder="Confirmar contraseña" required style="width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white" />
          <button type="submit" style="width: 100%; padding: 14px; background: var(--primary); border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: 600">Guardar y Entrar</button>
        </form>
    </div>
  </body>
</html>
